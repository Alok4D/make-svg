<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Space Midnight Background Radial Ambient Gradient -->
    <radialGradient id="bgAmbient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#221445" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#161033" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#0E0B20" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#070611" />
    </radialGradient>

    <!-- Neon Violet / Electric Purple Gradient for Bars -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="25%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Electric Violet Outer Glow Filter -->
    <filter id="neonPurpleGlow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blurMid" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blurSharp" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurMid" />
        <feMergeNode in="blurSharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

