<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#EDB3D3" />
      <stop offset="100%" stop-color="#E29BBF" />
    </radialGradient>

    <!-- Clock Face Drop Shadow -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#803358" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Hand Shadow -->
    <filter id="handShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <style><![CDATA[
      /* Long Ochre Hand Animation: Dynamic sweep, timelapse burst, and elegant rhythm */
      @keyframes longHandMotion {
        0% {
          transform: rotate(0deg);
        }
        20% {
          transform: rotate(180deg);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        40% {
          transform: rotate(450deg);
          animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }
        55% {
          transform: rotate(630deg);
          animation-timing-function: cubic-bezier(0.7, 0, 0.3, 1);
        }
        75% {
          transform: rotate(990deg);
          animation-timing-function: cubic-bezier(0.3, 0, 0.1, 1);
        }
        90% {
          transform: rotate(1060deg);
          animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        100% {
          transform: rotate(1080deg);
        }
      }

      /* Short Terracotta Hand Animation: Proportionate gear movement with elastic catch-up */
      @keyframes shortHandMotion {
        0% {
          transform: rotate(-30deg);
        }
        25% {
          transform: rotate(45deg);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        50% {
          transform: rotate(120deg);
          animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }
        75% {
          transform: rotate(240deg);
          animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1);
        }
        90% {
          transform: rotate(325deg);
          animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        100% {
          transform: rotate(330deg);
        }
      }

      /* Pulse glow on center rivet */
      @keyframes centerPulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      /* Dial subtle breathing tone */
      @keyframes dialGlow {
        0%, 100% {
          fill: #000000;
        }
        50% {
          fill: #0c080e;
        }
      }

      .long-hand-group {
        transform-origin: 960px 540px;
        animation: longHandMotion 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .short-hand-group {
        transform-origin: 960px 540px;
        animation: shortHandMotion 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .center-cap {
        transform-origin: 960px 540px;
        animation: centerPulse 3s ease-in-out infinite;
      }

      .clock-face {
        animation: dialGlow 6s ease-in-out infinite;
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Clock Dial -->
  <g filter="url(#clockShadow)">
    <circle class="clock-face" cx="960" cy="540" r="360" fill="#000000" />
    
    <!-- Subtle Hour Markers / Minimalist Ticks -->
    <g fill="#FFFFFF">
      <circle cx="960.00" cy="225.00" r="5.5" opacity="0.55" />
      <circle cx="1117.50" cy="267.20" r="3.5" opacity="0.22" />
      <circle cx="1232.80" cy="382.50" r="3.5" opacity="0.22" />
      <circle cx="1275.00" cy="540.00" r="5.5" opacity="0.55" />
      <circle cx="1232.80" cy="697.50" r="3.5" opacity="0.22" />
      <circle cx="1117.50" cy="812.80" r="3.5" opacity="0.22" />
      <circle cx="960.00" cy="855.00" r="5.5" opacity="0.55" />
      <circle cx="802.50" cy="812.80" r="3.5" opacity="0.22" />
      <circle cx="687.20" cy="697.50" r="3.5" opacity="0.22" />
      <circle cx="645.00" cy="540.00" r="5.5" opacity="0.55" />
      <circle cx="687.20" cy="382.50" r="3.5" opacity="0.22" />
      <circle cx="802.50" cy="267.20" r="3.5" opacity="0.22" />
    </g>

    <!-- Short Hand (Terracotta) -->
    <g class="short-hand-group" filter="url(#handShadow)">
      <!-- Hand stem pointing upwards from (960, 540) to length 180 with tail 45 -->
      <line x1="960" y1="585" x2="960" y2="360" stroke="#D4553A" stroke-width="24" stroke-linecap="round" />
      <circle cx="960" cy="360" r="3.5" fill="#FFE5DE" opacity="0.6" />
    </g>

    <!-- Long Hand (Ochre) -->
    <g class="long-hand-group" filter="url(#handShadow)">
      <!-- Hand stem pointing upwards from (960, 540) to length 285 with tail 75 -->
      <line x1="960" y1="615" x2="960" y2="255" stroke="#E8A44A" stroke-width="16" stroke-linecap="round" />
      <circle cx="960" cy="255" r="2.5" fill="#FFF2DE" opacity="0.7" />
    </g>

    <!-- Center Pivot / Rivet with Multi-Layered Rings -->
    <g class="center-cap">
      <!-- Outer soft accent ring -->
      <circle cx="960" cy="540" r="22" fill="#D4553A" />
      <circle cx="960" cy="540" r="15" fill="#E8A4C9" />
      <!-- Center shiny pin -->
      <circle cx="960" cy="540" r="7" fill="#803358" />
      <circle cx="960" cy="540" r="3" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>