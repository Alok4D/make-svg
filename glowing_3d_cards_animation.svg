<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="bgAmbient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#051808" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#020803" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="40%" stop-color="#2D4D32" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E1E11" stop-opacity="0.45" />
    </linearGradient>

    <!-- Main Hero Card Glass Gradient -->
    <linearGradient id="heroGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#3A6340" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#142617" stop-opacity="0.55" />
    </linearGradient>

    <!-- Intense Neon Green Glow Filter -->
    <filter id="neonGlowIntense" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blurMid" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blurSharp" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurMid" />
        <feMergeNode in="blurSharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Particle Glow -->
    <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Cards -->
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#39FF14" flood-opacity="0.3" />
    </filter>

    <style><![CDATA[
      /* ==========================================================
         EXACT SWISHY TIMELINE CHOREOGRAPHY (5.0s Loop):
         - 0.0s - 1.2s: Multi-card fan formation floating
         - 1.2s - 2.0s: Cards converge / merge into central hero card
         - 2.0s - 3.2s: Hero card pulses and focuses in center
         - 3.2s - 5.0s: Radial shockwave beams and particle ring burst
         ========================================================== */

      /* Outer Card 1: Top-Left -> Converge into Center */
      @keyframes card1Flight {
        0% {
          transform: translate(680px, 360px) rotate(-12deg) scale(0.95);
          opacity: 0.9;
        }
        25% {
          transform: translate(720px, 390px) rotate(-8deg) scale(0.92);
          opacity: 0.85;
        }
        40% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        90% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        98% {
          transform: translate(640px, 330px) rotate(-14deg) scale(0.85);
          opacity: 0.4;
        }
        100% {
          transform: translate(680px, 360px) rotate(-12deg) scale(0.95);
          opacity: 0.9;
        }
      }

      /* Outer Card 2: Top-Right -> Converge into Center */
      @keyframes card2Flight {
        0% {
          transform: translate(1240px, 350px) rotate(10deg) scale(0.95);
          opacity: 0.9;
        }
        25% {
          transform: translate(1200px, 385px) rotate(6deg) scale(0.92);
          opacity: 0.85;
        }
        40% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        90% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        98% {
          transform: translate(1280px, 320px) rotate(12deg) scale(0.85);
          opacity: 0.4;
        }
        100% {
          transform: translate(1240px, 350px) rotate(10deg) scale(0.95);
          opacity: 0.9;
        }
      }

      /* Outer Card 3: Bottom-Left -> Converge into Center */
      @keyframes card3Flight {
        0% {
          transform: translate(640px, 680px) rotate(8deg) scale(0.9);
          opacity: 0.85;
        }
        25% {
          transform: translate(710px, 640px) rotate(4deg) scale(0.88);
          opacity: 0.8;
        }
        40% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        90% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        98% {
          transform: translate(600px, 710px) rotate(10deg) scale(0.8);
          opacity: 0.3;
        }
        100% {
          transform: translate(640px, 680px) rotate(8deg) scale(0.9);
          opacity: 0.85;
        }
      }

      /* Outer Card 4: Bottom-Right -> Converge into Center */
      @keyframes card4Flight {
        0% {
          transform: translate(1280px, 670px) rotate(-9deg) scale(0.9);
          opacity: 0.85;
        }
        25% {
          transform: translate(1210px, 630px) rotate(-5deg) scale(0.88);
          opacity: 0.8;
        }
        40% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        90% {
          transform: translate(960px, 540px) rotate(0deg) scale(0.4);
          opacity: 0;
        }
        98% {
          transform: translate(1320px, 700px) rotate(-11deg) scale(0.8);
          opacity: 0.3;
        }
        100% {
          transform: translate(1280px, 670px) rotate(-9deg) scale(0.9);
          opacity: 0.85;
        }
      }

      /* Central Hero Card: Emerges from convergence, takes center stage, and pulses during shockwave */
      @keyframes heroCardAnim {
        0% {
          transform: translate(960px, 540px) scale(0.8);
          opacity: 0.6;
        }
        25% {
          transform: translate(960px, 540px) scale(0.85);
          opacity: 0.7;
        }
        38% {
          transform: translate(960px, 540px) scale(1.08);
          opacity: 1;
          animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        55% {
          transform: translate(960px, 540px) scale(1);
          opacity: 1;
        }
        70% {
          transform: translate(960px, 535px) scale(1.03);
          opacity: 1;
        }
        88% {
          transform: translate(960px, 540px) scale(1);
          opacity: 1;
        }
        98% {
          transform: translate(960px, 540px) scale(0.82);
          opacity: 0.7;
        }
        100% {
          transform: translate(960px, 540px) scale(0.8);
          opacity: 0.6;
        }
      }

      /* Radial Light Beams Shockwave (shoots out at 3.0s - 5.0s) */
      @keyframes beamShockwave {
        0%, 55% {
          transform: scale(0.2);
          opacity: 0;
        }
        60% {
          transform: scale(0.5);
          opacity: 0.8;
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1);
        }
        80% {
          transform: scale(1.1);
          opacity: 0.45;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }

      /* Radial Dot Particle Shockwave Ring (expands outwards at 3.0s - 5.0s) */
      @keyframes particleRingShockwave {
        0%, 55% {
          transform: scale(0.25);
          opacity: 0;
        }
        62% {
          transform: scale(0.65);
          opacity: 0.95;
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1);
        }
        82% {
          transform: scale(1.15);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.45);
          opacity: 0;
        }
      }

      .card-layer-1 { animation: card1Flight 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .card-layer-2 { animation: card2Flight 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .card-layer-3 { animation: card3Flight 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .card-layer-4 { animation: card4Flight 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .hero-card-layer { animation: heroCardAnim 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

      .shockwave-beams {
        transform-origin: 960px 540px;
        animation: beamShockwave 5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }

      .shockwave-particles {
        transform-origin: 960px 540px;
        animation: particleRingShockwave 5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#000000" />
  <rect width="1920" height="1080" fill="url(#bgAmbient)" opacity="0.65" />

  <!-- ========================================================== -->
  <!-- RADIAL SHOCKWAVE BEAMS & PARTICLE RING (Behind Hero Card)  -->
  <!-- ========================================================== -->
  <!-- 1. Radial Light Rays / Beams -->
  <g class="shockwave-beams" filter="url(#neonGlowIntense)">
    <line x1="1120.0" y1="540.0" x2="1280.0" y2="540.0" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1112.2" y1="570.9" x2="1264.3" y2="601.8" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1089.4" y1="598.8" x2="1218.9" y2="657.6" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1054.0" y1="620.9" x2="1148.1" y2="701.8" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1009.4" y1="635.1" x2="1058.9" y2="730.2" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="960.0" y1="640.0" x2="960.0" y2="740.0" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="910.6" y1="635.1" x2="861.1" y2="730.2" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="866.0" y1="620.9" x2="771.9" y2="701.8" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="830.6" y1="598.8" x2="701.1" y2="657.6" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="807.8" y1="570.9" x2="655.7" y2="601.8" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="800.0" y1="540.0" x2="640.0" y2="540.0" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="807.8" y1="509.1" x2="655.7" y2="478.2" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="830.6" y1="481.2" x2="701.1" y2="422.4" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="866.0" y1="459.1" x2="771.9" y2="378.2" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="910.6" y1="444.9" x2="861.1" y2="349.8" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="960.0" y1="440.0" x2="960.0" y2="340.0" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1009.4" y1="444.9" x2="1058.9" y2="349.8" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1054.0" y1="459.1" x2="1148.1" y2="378.2" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1089.4" y1="481.2" x2="1218.9" y2="422.4" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="1112.2" y1="509.1" x2="1264.3" y2="478.2" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- 2. Radial Expanding Particle Ring -->
  <g class="shockwave-particles" filter="url(#particleGlow)">
    <circle cx="1300.0" cy="540.0" r="4.5" fill="#39FF14" />
    <circle cx="1300.0" cy="540.0" r="2" fill="#FFFFFF" />
    <circle cx="1283.4" cy="611.1" r="4.5" fill="#39FF14" />
    <circle cx="1283.4" cy="611.1" r="2" fill="#FFFFFF" />
    <circle cx="1235.1" cy="675.2" r="4.5" fill="#39FF14" />
    <circle cx="1235.1" cy="675.2" r="2" fill="#FFFFFF" />
    <circle cx="1159.8" cy="726.1" r="4.5" fill="#39FF14" />
    <circle cx="1159.8" cy="726.1" r="2" fill="#FFFFFF" />
    <circle cx="1065.1" cy="758.7" r="4.5" fill="#39FF14" />
    <circle cx="1065.1" cy="758.7" r="2" fill="#FFFFFF" />
    <circle cx="960.0" cy="770.0" r="4.5" fill="#39FF14" />
    <circle cx="960.0" cy="770.0" r="2" fill="#FFFFFF" />
    <circle cx="854.9" cy="758.7" r="4.5" fill="#39FF14" />
    <circle cx="854.9" cy="758.7" r="2" fill="#FFFFFF" />
    <circle cx="760.2" cy="726.1" r="4.5" fill="#39FF14" />
    <circle cx="760.2" cy="726.1" r="2" fill="#FFFFFF" />
    <circle cx="684.9" cy="675.2" r="4.5" fill="#39FF14" />
    <circle cx="684.9" cy="675.2" r="2" fill="#FFFFFF" />
    <circle cx="636.6" cy="611.1" r="4.5" fill="#39FF14" />
    <circle cx="636.6" cy="611.1" r="2" fill="#FFFFFF" />
    <circle cx="620.0" cy="540.0" r="4.5" fill="#39FF14" />
    <circle cx="620.0" cy="540.0" r="2" fill="#FFFFFF" />
    <circle cx="636.6" cy="468.9" r="4.5" fill="#39FF14" />
    <circle cx="636.6" cy="468.9" r="2" fill="#FFFFFF" />
    <circle cx="684.9" cy="404.8" r="4.5" fill="#39FF14" />
    <circle cx="684.9" cy="404.8" r="2" fill="#FFFFFF" />
    <circle cx="760.2" cy="353.9" r="4.5" fill="#39FF14" />
    <circle cx="760.2" cy="353.9" r="2" fill="#FFFFFF" />
    <circle cx="854.9" cy="321.3" r="4.5" fill="#39FF14" />
    <circle cx="854.9" cy="321.3" r="2" fill="#FFFFFF" />
    <circle cx="960.0" cy="310.0" r="4.5" fill="#39FF14" />
    <circle cx="960.0" cy="310.0" r="2" fill="#FFFFFF" />
    <circle cx="1065.1" cy="321.3" r="4.5" fill="#39FF14" />
    <circle cx="1065.1" cy="321.3" r="2" fill="#FFFFFF" />
    <circle cx="1159.8" cy="353.9" r="4.5" fill="#39FF14" />
    <circle cx="1159.8" cy="353.9" r="2" fill="#FFFFFF" />
    <circle cx="1235.1" cy="404.8" r="4.5" fill="#39FF14" />
    <circle cx="1235.1" cy="404.8" r="2" fill="#FFFFFF" />
    <circle cx="1283.4" cy="468.9" r="4.5" fill="#39FF14" />
    <circle cx="1283.4" cy="468.9" r="2" fill="#FFFFFF" />
  </g>

  <!-- ========================================================== -->
  <!-- MULTI-CARD SATELLITE LAYERS (Converging into Center)        -->
  <!-- ========================================================== -->

  <!-- Card 1: Top-Left -->
  <g class="card-layer-1" filter="url(#cardShadow)">
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="url(#glassGrad)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="2" filter="url(#neonGlowIntense)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="-125" y1="-65" x2="-20" y2="-65" stroke="#39FF14" stroke-width="6" stroke-linecap="round" />
    <line x1="-125" y1="35" x2="60" y2="35" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-125" y1="58" x2="0" y2="58" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Card 2: Top-Right -->
  <g class="card-layer-2" filter="url(#cardShadow)">
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="url(#glassGrad)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="2" filter="url(#neonGlowIntense)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="-125" y1="-65" x2="-20" y2="-65" stroke="#39FF14" stroke-width="6" stroke-linecap="round" />
    <line x1="-125" y1="35" x2="60" y2="35" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-125" y1="58" x2="0" y2="58" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Card 3: Bottom-Left -->
  <g class="card-layer-3" filter="url(#cardShadow)">
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="url(#glassGrad)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="2" filter="url(#neonGlowIntense)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="-125" y1="-65" x2="-20" y2="-65" stroke="#39FF14" stroke-width="6" stroke-linecap="round" />
    <line x1="-125" y1="35" x2="60" y2="35" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-125" y1="58" x2="0" y2="58" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Card 4: Bottom-Right -->
  <g class="card-layer-4" filter="url(#cardShadow)">
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="url(#glassGrad)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="2" filter="url(#neonGlowIntense)" />
    <rect x="-160" y="-100" width="320" height="200" rx="18" fill="none" stroke="#39FF14" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="-125" y1="-65" x2="-20" y2="-65" stroke="#39FF14" stroke-width="6" stroke-linecap="round" />
    <line x1="-125" y1="35" x2="60" y2="35" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-125" y1="58" x2="0" y2="58" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- ========================================================== -->
  <!-- MAIN CENTRAL HERO CARD (Exact Swishy Styling & Glow)      -->
  <!-- ========================================================== -->
  <g class="hero-card-layer" filter="url(#cardShadow)">
    <!-- Glass Body -->
    <rect x="-175" y="-110" width="350" height="220" rx="20" fill="url(#heroGlassGrad)" />
    
    <!-- Radiant Neon Border & Outline -->
    <rect x="-175" y="-110" width="350" height="220" rx="20" fill="none" stroke="#39FF14" stroke-width="2.6" filter="url(#neonGlowIntense)" />
    <rect x="-175" y="-110" width="350" height="220" rx="20" fill="none" stroke="#39FF14" stroke-width="1.6" stroke-opacity="1" />
    
    <!-- Top Neon Accent Header Bar -->
    <line x1="-138" y1="-72" x2="-25" y2="-72" stroke="#39FF14" stroke-width="7" stroke-linecap="round" filter="url(#neonGlowIntense)" />
    <line x1="-138" y1="-72" x2="-25" y2="-72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Content Placeholder Lines -->
    <line x1="-138" y1="42" x2="80" y2="42" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" />
    <line x1="-138" y1="68" x2="15" y2="68" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>