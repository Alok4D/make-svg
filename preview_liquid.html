<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Liquid Circle Loader Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 24px;
  }
  .label {
    font-family: monospace;
    font-size: 13px;
    color: #666;
    background: white;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .frame {
    background: white;
    width: 960px;
    height: 540px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  object, embed {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <div class="label">liquid_circle_loading_1080p.svg — 1920×1080</div>
  <div class="frame">
    <object type="image/svg+xml" data="liquid_circle_loading_1080p.svg">
      <embed type="image/svg+xml" src="liquid_circle_loading_1080p.svg">
    </object>
  </div>
</body>
</html>
