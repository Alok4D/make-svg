        0% {
          transform: scale(0.92);
          opacity: 0;
        }
        8% {
          transform: scale(1.02);
          opacity: 1;
          animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        14% {
          transform: scale(1);
        }
        94% {
          transform: scale(1);
          opacity: 1;
        }
        98% {
          transform: scale(0.96);
          opacity: 0.8;
        }
        100% {
          transform: scale(0.92);
          opacity: 0;
        }
      }

