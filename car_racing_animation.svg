<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sun Center Radial Gradient -->
    <radialGradient id="sunCoreGrad" cx="50%" cy="50%" r="50%" fx="48%" fy="45%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </radialGradient>

    <!-- Sun Outer Atmospheric Glow (Amber / Gold) -->
    <filter id="sunAtmosphereGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
    </linearGradient>

    <!-- Headlight Bulb Glow -->
    <filter id="bulbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow for Car -->
    <filter id="carGroundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <style><![CDATA[
      /* Sun 10-Second Loop:
         0s-1.2s: Drops in from top with smooth spring bounce
         1.2s-9.2s: Stays in place shining with atmospheric glow
         9.2s-10.0s: Fades/resets gracefully for the next 10s loop
      */
      @keyframes sunDrop10s {
        0% {
          transform: translateY(-380px) scale(0.8);
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        14% {
          transform: translateY(12px) scale(1.03);
          animation-timing-function: cubic-bezier(0.34, 1.35, 0.64, 1);
        }
        20% {
          transform: translateY(0px) scale(1);
          animation-timing-function: ease-in-out;
        }
        50% {
          transform: translateY(-5px) scale(1.01);
          animation-timing-function: ease-in-out;
        }
        85% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        94% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateY(-380px) scale(0.8);
          opacity: 0;
        }
      }

      /* Sun Glow Breathing Pulse */
      @keyframes sunGlowPulse {
        0%, 100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.12);
        }
      }

      /* Road Markings infinite continuous scroll motion */
      @keyframes moveRoad {
        0% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 320;
        }
      }

      /* Car Driving 10-Second Choreography:
         0s-1.2s: Enters driving into lane
         1.2s-9.0s: Cruising steadily with dynamic slight drifting
         9.0s-10.0s: Smooth cycle reset to loop again
      */
      @keyframes carDrive10s {
        0% {
          transform: translateX(-480px);
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        15% {
          transform: translateX(0px);
        }
        35% {
          transform: translateX(35px);
        }
        55% {
          transform: translateX(-15px);
        }
        75% {
          transform: translateX(25px);
        }
        90% {
          transform: translateX(0px);
          opacity: 1;
        }
        96% {
          opacity: 1;
        }
        100% {
          transform: translateX(-480px);
          opacity: 0;
        }
      }

      /* Car Suspension Bounce */
      @keyframes carBounce {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        20% {
          transform: translateY(-4px) rotate(-0.4deg);
        }
        40% {
          transform: translateY(2px) rotate(0.3deg);
        }
        60% {
          transform: translateY(-3px) rotate(-0.2deg);
        }
        80% {
          transform: translateY(1.5px) rotate(0.2deg);
        }
      }

      /* Wheel 360 Spin */
      @keyframes spinWheel {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Dust / Exhaust Particles Puffs */
      @keyframes dustPuff1 {
        0% {
          transform: translate(0px, 0px) scale(0.4);
          opacity: 0.6;
        }
        50% {
          opacity: 0.35;
        }
        100% {
          transform: translate(-120px, -45px) scale(1.6);
          opacity: 0;
        }
      }

      @keyframes dustPuff2 {
        0% {
          transform: translate(0px, 0px) scale(0.3);
          opacity: 0.7;
        }
        50% {
          opacity: 0.4;
        }
        100% {
          transform: translate(-150px, -60px) scale(1.8);
          opacity: 0;
        }
      }

      @keyframes dustPuff3 {
        0% {
          transform: translate(0px, 0px) scale(0.5);
          opacity: 0.5;
        }
        50% {
          opacity: 0.25;
        }
        100% {
          transform: translate(-100px, -35px) scale(1.4);
          opacity: 0;
        }
      }

      .sun-anim-group {
        transform-origin: 1380px 260px;
        animation: sunDrop10s 10s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .sun-glow-mesh {
        transform-origin: 1380px 260px;
        animation: sunGlowPulse 2.5s ease-in-out infinite alternate;
      }

      .road-lines {
        stroke-dasharray: 140 180;
        animation: moveRoad 0.75s linear infinite;
      }

      .car-container {
        animation: carDrive10s 10s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .car-chassis {
        animation: carBounce 0.32s ease-in-out infinite;
      }

      .wheel-spoke-1 {
        transform-origin: 65px 74px;
        animation: spinWheel 0.4s linear infinite;
      }

      .wheel-spoke-2 {
        transform-origin: 215px 74px;
        animation: spinWheel 0.4s linear infinite;
      }

      .dust-1 {
        transform-origin: 0px 0px;
        animation: dustPuff1 0.7s ease-out infinite;
      }

      .dust-2 {
        transform-origin: 0px 0px;
        animation: dustPuff2 0.7s ease-out infinite 0.23s;
      }

      .dust-3 {
        transform-origin: 0px 0px;
        animation: dustPuff3 0.7s ease-out infinite 0.46s;
      }
    ]]></style>
  </defs>

  <!-- Sky Background (#0f172a) -->
  <rect width="1920" height="1080" fill="#0F172A" />

  <!-- Animated Sun Group (10s Loop: Drops from top into position 1380, 260) -->
  <g class="sun-anim-group">
    <!-- Atmospheric Radiant Glow Outer Layer -->
    <g class="sun-glow-mesh">
      <!-- Wide diffuse ambient halo -->
      <circle cx="1380" cy="260" r="130" fill="#F59E0B" opacity="0.38" filter="url(#sunAtmosphereGlow)" />
      <circle cx="1380" cy="260" r="85" fill="#FFA000" opacity="0.5" filter="url(#sunAtmosphereGlow)" />
    </g>

    <!-- Crisp Dark Border Rim + Glowing Sun Disc -->
    <circle cx="1380" cy="260" r="54" fill="url(#sunCoreGrad)" />
    <circle cx="1380" cy="260" r="54" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-opacity="0.9" />
  </g>

  <!-- Road Surface (#1e293b) -->
  <g id="roadGroup">
    <!-- Road Base -->
    <rect x="0" y="540" width="1920" height="540" fill="#1E293B" />
    <!-- Subtle Road Top Rim -->
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#334155" stroke-width="2.5" />
    <!-- Yellow Dashed Road Lines (#fbbf24) -->
    <path class="road-lines" d="M -400 568 L 2400 568" stroke="#FBBF24" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- Main Animated Vehicle Group -->
  <g transform="translate(840, 475)">
    <!-- Dust Particles Emitting Behind Rear Wheel -->
    <g transform="translate(45, 68)">
      <circle class="dust-1" cx="0" cy="0" r="14" fill="#64748B" opacity="0" />
      <circle class="dust-2" cx="0" cy="0" r="18" fill="#475569" opacity="0" />
      <circle class="dust-3" cx="0" cy="0" r="12" fill="#94A3B8" opacity="0" />
    </g>

    <!-- Driving & Bouncing Car Body Container (10s Cycle) -->
    <g class="car-container">
      <!-- Ground Contact Shadow beneath Car -->
      <ellipse cx="140" cy="84" rx="145" ry="10" fill="#0A0F1D" opacity="0.6" filter="url(#carGroundShadow)" />

      <!-- Headlight Beam Projection (Forward to Right) -->
      <polygon points="280,48 560,0 560,110" fill="url(#headlightBeam)" opacity="0.35" />

      <!-- Car Chassis and Wheels with Suspension Bounce -->
      <g class="car-chassis">
        <!-- Main Blue Body Chassis (#3b82f6) -->
        <rect x="15" y="32" width="265" height="42" rx="12" fill="#3B82F6" />
        <rect x="0" y="44" width="280" height="30" rx="10" fill="#3B82F6" />

        <!-- Upper Cabin Roof & Pillars -->
        <path d="M 62 34 L 88 4 Q 92 0 98 0 L 182 0 Q 188 0 192 4 L 222 34 Z" fill="#3B82F6" />

        <!-- Windows (#60a5fa) -->
        <!-- Rear Window -->
        <path d="M 68 31 L 91 8 Q 94 5 98 5 L 136 5 L 136 31 Z" fill="#60A5FA" />
        <!-- Front Window -->
        <path d="M 144 31 L 144 5 L 182 5 Q 186 5 189 8 L 214 31 Z" fill="#60A5FA" />

        <!-- Taillight (Rear Left Indicator - Red #ef4444) -->
        <rect x="-2" y="46" width="7" height="13" rx="3.5" fill="#EF4444" />

        <!-- Headlight Bulb (Front Right Indicator - Yellow #fbbf24) -->
        <path d="M 276 45 A 6.5 6.5 0 0 1 276 58 Z" fill="#FBBF24" filter="url(#bulbGlow)" />
        <circle cx="278" cy="51.5" r="3.5" fill="#FEF08A" />

        <!-- Rear Wheel Well Cutout / Rim -->
        <g>
          <!-- Rear Tire -->
          <circle cx="65" cy="74" r="27" fill="#1E293B" stroke="#0F172A" stroke-width="4.5" />
          <!-- Rear Rim Core -->
          <circle cx="65" cy="74" r="14" fill="#334155" />
          <!-- Rear 4-Spoke Cross Lines -->
          <g class="wheel-spoke-1">
            <line x1="65" y1="50" x2="65" y2="98" stroke="#64748B" stroke-width="4.5" stroke-linecap="round" />
            <line x1="41" y1="74" x2="89" y2="74" stroke="#64748B" stroke-width="4.5" stroke-linecap="round" />
            <circle cx="65" cy="74" r="5" fill="#0F172A" />
            <circle cx="65" cy="74" r="2.5" fill="#94A3B8" />
          </g>
        </g>

        <!-- Front Wheel Well Cutout / Rim -->
        <g>
          <!-- Front Tire -->
          <circle cx="215" cy="74" r="27" fill="#1E293B" stroke="#0F172A" stroke-width="4.5" />
          <!-- Front Rim Core -->
          <circle cx="215" cy="74" r="14" fill="#334155" />
          <!-- Front 4-Spoke Cross Lines -->
          <g class="wheel-spoke-2">
            <line x1="215" y1="50" x2="215" y2="98" stroke="#64748B" stroke-width="4.5" stroke-linecap="round" />
            <line x1="191" y1="74" x2="239" y2="74" stroke="#64748B" stroke-width="4.5" stroke-linecap="round" />
            <circle cx="215" cy="74" r="5" fill="#0F172A" />
            <circle cx="215" cy="74" r="2.5" fill="#94A3B8" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>