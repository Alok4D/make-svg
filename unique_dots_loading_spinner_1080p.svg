<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      * {
        box-sizing: border-box;
      }

      .bg-canvas {
        fill: #0008f5;
      }

      .spinner-group {
        fill: #ffffff;
        transform-origin: 960.0px 540.0px;
        animation: spin 1s steps(12, end) infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    ]]></style>
  </defs>

  <!-- Chroma Blue Canvas -->
  <rect class="bg-canvas" width="1920" height="1080" />

  <!-- 12-Dot Stepped Loading Spinner (Ultra-HD 1080p Master) -->
  <g class="spinner-group">
    <circle cx="960.0" cy="200.0" r="71.4" opacity="1.0" />
    <circle cx="790.0" cy="245.55" r="71.4" opacity="0.9" />
    <circle cx="665.55" cy="370.0" r="71.4" opacity="0.81" />
    <circle cx="620.0" cy="540.0" r="71.4" opacity="0.72" />
    <circle cx="665.55" cy="710.0" r="71.4" opacity="0.63" />
    <circle cx="790.0" cy="834.45" r="71.4" opacity="0.54" />
    <circle cx="960.0" cy="880.0" r="71.4" opacity="0.45" />
    <circle cx="1130.0" cy="834.45" r="71.4" opacity="0.36" />
    <circle cx="1254.45" cy="710.0" r="71.4" opacity="0.27" />
    <circle cx="1300.0" cy="540.0" r="71.4" opacity="0.18" />
    <circle cx="1254.45" cy="370.0" r="71.4" opacity="0.08" />
    <circle cx="1130.0" cy="245.55" r="71.4" opacity="0.0" />
  </g>
</svg>