<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background: #000000; overflow: hidden;">
  <rect width="1920" height="1080" fill="#000000" />
  
  <defs>
    <!-- Glow and Glitch Filters -->
    <filter id="asciiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="digitalGlitch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.95" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Modular Digital ASCII Glyphs (Width ~170, Height ~220) -->
    <!-- Centered around (0,0): Origin (-85, -110) -->

    <!-- ASCII Digit "2" -->
    <g id="ascii-digit-2">
      <!-- Top Bar -->
      <rect x="-85" y="-110" width="170" height="38" fill="#FFFFFF" />
      <!-- Top Right Connector -->
      <rect x="47" y="-72" width="38" height="54" fill="#FFFFFF" />
      <!-- Middle Bar -->
      <rect x="-85" y="-18" width="170" height="38" fill="#FFFFFF" />
      <!-- Bottom Left Connector -->
      <rect x="-85" y="20" width="38" height="52" fill="#FFFFFF" />
      <!-- Bottom Bar -->
      <rect x="-85" y="72" width="170" height="38" fill="#FFFFFF" />
    </g>

    <!-- ASCII Digit "0" -->
    <g id="ascii-digit-0">
      <!-- Outer Box with Hollow Center -->
      <path d="M -85,-110 L 85,-110 L 85,110 L -85,110 Z M -47,-72 L -47,72 L 47,72 L 47,-72 Z" fill="#FFFFFF" fill-rule="evenodd" />
    </g>

    <!-- ASCII Digit "7" -->
    <g id="ascii-digit-7">
      <!-- Top Horizontal Bar -->
      <rect x="-85" y="-110" width="170" height="38" fill="#FFFFFF" />
      <!-- Right Vertical Spine -->
      <rect x="47" y="-72" width="38" height="182" fill="#FFFFFF" />
    </g>

    <!-- Matrix Scanline Overlay Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .huge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', 'Montserrat', 'Segoe UI Black', sans-serif;
      font-weight: 900;
      font-size: 420px;
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- ================= STAGE 1: SMOOTH BOLD TYPOGRAPHY (0.0s - 2.0s) ================= -->
  <g id="stage-smooth-typography">
    <!-- Opacity Transition: Bright 0.0s-1.85s, Glitch/Cut at 1.95s, Off during ASCII, Returns at 3.95s -->
    <animate attributeName="opacity"
      values="0.4; 0.95; 1.0; 1.0; 0; 0; 0; 0.4"
      keyTimes="0; 0.15; 0.25; 0.48; 0.50; 0.95; 0.98; 1"
      dur="4.0s" repeatCount="indefinite" />

    <!-- Top Left: "2" -->
    <text x="770" y="320" class="huge-text">2</text>

    <!-- Top Right: "0" -->
    <text x="1150" y="320" class="huge-text">0</text>

    <!-- Bottom Left: "2" -->
    <text x="770" y="760" class="huge-text">2</text>

    <!-- Bottom Right: "7" -->
    <text x="1150" y="760" class="huge-text">7</text>
  </g>


  <!-- ================= STAGE 2: MODULAR ASCII MATRIX GLYPHS (2.0s - 4.0s) ================= -->
  <g id="stage-ascii-glyphs" filter="url(#asciiGlow)">
    <!-- Opacity Transition: Off 0.0s-1.95s, Snaps ON at 2.0s with digital flicker, Stays until 3.95s -->
    <animate attributeName="opacity"
      values="0; 0; 0; 1.0; 0.88; 1.0; 0.92; 1.0; 0.85; 1.0; 0; 0"
      keyTimes="0; 0.48; 0.495; 0.51; 0.58; 0.68; 0.76; 0.85; 0.92; 0.97; 0.985; 1"
      dur="4.0s" repeatCount="indefinite" />

    <!-- Top Left: ASCII "2" -->
    <g transform="translate(770, 320)">
      <use href="#ascii-digit-2" />
    </g>

    <!-- Top Right: ASCII "0" -->
    <g transform="translate(1150, 320)">
      <use href="#ascii-digit-0" />
    </g>

    <!-- Bottom Left: ASCII "2" -->
    <g transform="translate(770, 760)">
      <use href="#ascii-digit-2" />
    </g>

    <!-- Bottom Right: ASCII "7" -->
    <g transform="translate(1150, 760)">
      <use href="#ascii-digit-7" />
    </g>
  </g>

  <!-- Digital CRT Scanline Overlay -->
  <rect width="1920" height="1080" fill="url(#scanlines)" pointer-events="none" />
</svg>
