<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background: #E8A4C9; overflow: hidden;">
  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="#E8A4C9" />

  <defs>
    <!-- Drop Shadows -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7B3A5E" flood-opacity="0.25" />
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Pill Template Symbol -->
    <!-- Pill dimensions: width 150, height 56, rx 28 -->
    <!-- Centered origin (0, 0) -> rect x="-75", y="-28" -->
  </defs>

  <!-- ================= CLOCK CONTAINER ================= -->
  <g transform="translate(960, 540)">

    <!-- Clock Face Disc (Radius 360) -->
    <!-- Transition color: #9A677F at 0s -> #000000 from 0.7s to 4s -->
    <circle cx="0" cy="0" r="360" filter="url(#clockShadow)">
      <animate attributeName="fill"
        values="#9A677F; #000000; #000000; #000000; #9A677F"
        keyTimes="0; 0.20; 0.50; 0.95; 1"
        dur="4.0s" repeatCount="indefinite" />
    </circle>

    <!-- ================= CLOCK HANDS ================= -->

    <!-- Long Hand (Color: #E8A44A, Length 315, Width 14, Rounded) -->
    <!-- Sweeps from ~ -55deg (10 o'clock) -> +145deg (5 o'clock) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-55; -55; 145; 152; -55"
        keyTimes="0; 0.08; 0.50; 0.92; 1"
        keySplines="0.4 0 0.2 1; 0.25 1 0.5 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="4.0s" repeatCount="indefinite" />
      <path d="M -7,0 L -7,-305 C -7,-313 7,-313 7,-305 L 7,0 Z" fill="#E8A44A" />
      <circle cx="0" cy="-305" r="7" fill="#E8A44A" />
    </g>

    <!-- Short Hand (Color: #D4553A, Length 205, Width 16, Rounded) -->
    <!-- Pointing towards ~ 11:30 (-20deg -> -8deg -> -20deg) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-20; -20; -8; -10; -20"
        keyTimes="0; 0.08; 0.50; 0.92; 1"
        keySplines="0.4 0 0.2 1; 0.25 1 0.5 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="4.0s" repeatCount="indefinite" />
      <path d="M -8,0 L -8,-195 C -8,-204 8,-204 8,-195 L 8,0 Z" fill="#D4553A" />
      <circle cx="0" cy="-195" r="8" fill="#D4553A" />
    </g>

    <!-- Center Pivot Dot -->
    <circle cx="0" cy="0" r="18" fill="#D4553A" stroke="#E8A4C9" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#E8A4C9" />

    <!-- ================= TEXT PILLS (ANIMATED DROP & STACK) ================= -->
    <!-- Pill 1: "instant" -->
    <!-- t=0s: (0, -290) -> t=2s: (0, -290) -> t=3s: drops to (0, 205) stacked 3rd -->
    <g filter="url(#pillShadow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 -290; 0 -290; 0 -290; 0 205; 0 205; 0 -290"
        keyTimes="0; 0.25; 0.50; 0.72; 0.92; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.55 0 0.1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="4.0s" repeatCount="indefinite" />
      <g>
        <animate attributeName="opacity"
          values="0; 1; 1; 1; 1; 0"
          keyTimes="0; 0.15; 0.50; 0.92; 0.96; 1"
          dur="4.0s" repeatCount="indefinite" />
        <rect x="-80" y="-28" width="160" height="56" rx="28" fill="#FFFFFF" />
        <text x="0" y="2" text-anchor="middle" dominant-baseline="central"
          font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-style="italic" font-weight="700" font-size="30" fill="#1A1A1A" letter-spacing="-0.5">instant</text>
      </g>
    </g>

    <!-- Pill 2: "moment" -->
    <!-- t=0s: (0, -10) -> t=2s: (0, -10) -> t=3s: drops to (0, 145) stacked 2nd -->
    <g filter="url(#pillShadow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 -10; 0 -10; 0 -10; 0 145; 0 145; 0 -10"
        keyTimes="0; 0.25; 0.50; 0.72; 0.92; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.55 0 0.1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="4.0s" repeatCount="indefinite" />
      <g>
        <animate attributeName="opacity"
          values="0; 1; 1; 1; 1; 0"
          keyTimes="0; 0.15; 0.50; 0.92; 0.96; 1"
          dur="4.0s" repeatCount="indefinite" />
        <rect x="-86" y="-28" width="172" height="56" rx="28" fill="#FFFFFF" />
        <text x="0" y="2" text-anchor="middle" dominant-baseline="central"
          font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-style="italic" font-weight="700" font-size="30" fill="#1A1A1A" letter-spacing="-0.5">moment</text>
      </g>
    </g>

    <!-- Pill 3: "present" -->
    <!-- t=0s: (0, 140) -> t=2s: (0, 140) -> t=3s: drops to (0, 85) top of stack -->
    <g filter="url(#pillShadow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 140; 0 140; 0 140; 0 85; 0 85; 0 140"
        keyTimes="0; 0.25; 0.50; 0.72; 0.92; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.55 0 0.1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="4.0s" repeatCount="indefinite" />
      <g>
        <animate attributeName="opacity"
          values="0; 1; 1; 1; 1; 0"
          keyTimes="0; 0.15; 0.50; 0.92; 0.96; 1"
          dur="4.0s" repeatCount="indefinite" />
        <rect x="-84" y="-28" width="168" height="56" rx="28" fill="#FFFFFF" />
        <text x="0" y="2" text-anchor="middle" dominant-baseline="central"
          font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-style="italic" font-weight="700" font-size="30" fill="#1A1A1A" letter-spacing="-0.5">present</text>
      </g>
    </g>

    <!-- Pill 4: "hour" -->
    <!-- Appears / lands at the very bottom of the stack at (0, 265) -->
    <g filter="url(#pillShadow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 320; 0 320; 0 320; 0 265; 0 265; 0 320"
        keyTimes="0; 0.35; 0.55; 0.72; 0.92; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.55 0 0.1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="4.0s" repeatCount="indefinite" />
      <g>
        <animate attributeName="opacity"
          values="0; 0; 0; 1; 1; 0"
          keyTimes="0; 0.45; 0.55; 0.65; 0.92; 0.96"
          dur="4.0s" repeatCount="indefinite" />
        <rect x="-65" y="-26" width="130" height="52" rx="26" fill="#FFFFFF" />
        <text x="0" y="2" text-anchor="middle" dominant-baseline="central"
          font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-style="italic" font-weight="700" font-size="28" fill="#1A1A1A" letter-spacing="-0.5">hour</text>
      </g>
    </g>

  </g>
</svg>
