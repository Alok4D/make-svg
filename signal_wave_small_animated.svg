<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2048 1480"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet">

  <title>Signal Wave Animated SVG (Ultra-Smooth 60fps)</title>

  <defs>
    <style><![CDATA[
      * {
        box-sizing: border-box;
      }

      .signal {
        fill: none;
        stroke: #EA1615;
        stroke-width: 74;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Centered & Prominently Scaled Container */
      .icon {
        transform-origin: 1024px 740px;
        transform: scale(0.88);
      }

      /* 1. Core Circle Animation */
      .core {
        fill: #EA1615;
        transform-origin: 1024px 740px;
        animation: corePulse 4.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes corePulse {
        0% {
          opacity: 0;
          transform: scale(0.25);
        }
        8% {
          opacity: 1;
          transform: scale(1.08);
        }
        14% {
          opacity: 1;
          transform: scale(1);
        }
        70% {
          opacity: 1;
          transform: scale(1);
        }
        85% {
          opacity: 0.6;
          transform: scale(0.92);
        }
        94%, 100% {
          opacity: 0;
          transform: scale(0.3);
        }
      }

      /* 2. Symmetrical Signal Waves Animations with Exact Arc Lengths */
      .wave {
        opacity: 0;
        animation-duration: 4.2s;
        animation-timing-function: cubic-bezier(0.25, 1, 0.4, 1);
        animation-iteration-count: infinite;
      }

      /* Inner Wave (Length ~951px) */
      .wave.inner {
        stroke-dasharray: 951;
        stroke-dashoffset: 951;
        animation-name: waveInner;
      }

      @keyframes waveInner {
        0%, 12% {
          opacity: 0;
          stroke-dashoffset: 951;
        }
        14% {
          opacity: 1;
        }
        32% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
        68% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
        84% {
          opacity: 0;
          stroke-dashoffset: 0;
        }
        88%, 100% {
          opacity: 0;
          stroke-dashoffset: 951;
        }
      }

      /* Middle Wave (Length ~1280px) */
      .wave.middle {
        stroke-dasharray: 1280;
        stroke-dashoffset: 1280;
        animation-name: waveMiddle;
      }

      @keyframes waveMiddle {
        0%, 22% {
          opacity: 0;
          stroke-dashoffset: 1280;
        }
        24% {
          opacity: 1;
        }
        44% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
        74% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
        88% {
          opacity: 0;
          stroke-dashoffset: 0;
        }
        92%, 100% {
          opacity: 0;
          stroke-dashoffset: 1280;
        }
      }

      /* Outer Wave (Length ~1591px) */
      .wave.outer {
        stroke-dasharray: 1591;
        stroke-dashoffset: 1591;
        animation-name: waveOuter;
      }

      @keyframes waveOuter {
        0%, 34% {
          opacity: 0;
          stroke-dashoffset: 1591;
        }
        36% {
          opacity: 1;
        }
        56% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
        80% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
        92% {
          opacity: 0;
          stroke-dashoffset: 0;
        }
        96%, 100% {
          opacity: 0;
          stroke-dashoffset: 1591;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .core, .wave {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
    ]]></style>
  </defs>

  <!-- Solid White Background -->
  <rect width="2048" height="1480" fill="#ffffff" />

  <g class="icon">

    <!-- Center Circle (Core) -->
    <circle class="core" cx="1024" cy="740" r="227" />

    <!-- Inner Wave Pair -->
    <path class="signal wave inner left"
          d="M698 300 C500 505 500 975 698 1180" />
    <path class="signal wave inner right"
          d="M1350 300 C1548 505 1548 975 1350 1180" />

    <!-- Middle Wave Pair -->
    <path class="signal wave middle left"
          d="M518 170 C185 490 185 990 518 1310" />
    <path class="signal wave middle right"
          d="M1530 170 C1863 490 1863 990 1530 1310" />

    <!-- Outer Wave Pair -->
    <path class="signal wave outer left"
          d="M342 38 C-85 420 -85 1060 342 1442" />
    <path class="signal wave outer right"
          d="M1706 38 C2133 420 2133 1060 1706 1442" />

  </g>
</svg>