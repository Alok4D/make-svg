        <path d="M-20 -5 C-26 5 -26 13 -20 22" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity"
                   values="0; 0; 0.95; 0.45; 0.95; 0.45; 0; 0"
                   keyTimes="0; 0.20; 0.26; 0.38; 0.50; 0.62; 0.75; 1"
                   dur="4.5s" repeatCount="indefinite"/>
