<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Crisp High-Definition Clean Neon Glow (Leaves Source Graphic 100% Sharp) -->
    <filter id="crispNeonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#40FF1A" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#40FF1A" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#40FF1A" flood-opacity="0.18" />
    </filter>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@800;900&display=swap');

      * {
        box-sizing: border-box;
      }

      /* Outer Spinner Arc Loading Animation */
      @keyframes arcSpinner {
        0% {
          stroke-dashoffset: 1256.64;
          transform: rotate(-90deg);
          opacity: 0.9;
        }
        25% {
          stroke-dashoffset: 502.65;
          transform: rotate(90deg);
        }
        36% {
          stroke-dashoffset: 150.80;
          transform: rotate(230deg);
        }
        45% {
          stroke-dashoffset: 100.53;
          transform: rotate(270deg);
          animation-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1);
        }
        75% {
          stroke-dashoffset: 100.53;
          transform: rotate(270deg) scale(1.02);
          animation-timing-function: ease-in-out;
        }
        88% {
          stroke-dashoffset: 100.53;
          transform: rotate(270deg) scale(1);
          opacity: 1;
        }
        96% {
          opacity: 0.8;
          transform: rotate(270deg) scale(0.98);
        }
        100% {
          stroke-dashoffset: 1256.64;
          transform: rotate(-90deg);
          opacity: 0.9;
        }
      }

      /* Center Dollar Sign Pop-in & Heartbeat Pulse */
      @keyframes dollarBurst {
        0% {
          transform: translate(960px, 540px) scale(0);
          opacity: 0;
        }
        24% {
          transform: translate(960px, 540px) scale(0.1);
          opacity: 0.1;
        }
        36% {
          transform: translate(960px, 540px) scale(1.15);
          opacity: 1;
          animation-timing-function: cubic-bezier(0.34, 1.5, 0.64, 1);
        }
        46% {
          transform: translate(960px, 540px) scale(1);
          animation-timing-function: ease-in-out;
        }
        60% {
          transform: translate(960px, 540px) scale(1.05);
          animation-timing-function: ease-in-out;
        }
        75% {
          transform: translate(960px, 540px) scale(1);
          animation-timing-function: ease-in-out;
        }
        88% {
          transform: translate(960px, 540px) scale(1.02);
          opacity: 1;
        }
        96% {
          transform: translate(960px, 540px) scale(0.95);
          opacity: 0.6;
        }
        100% {
          transform: translate(960px, 540px) scale(0);
          opacity: 0;
        }
      }

      .loading-arc {
        stroke-dasharray: 1256.64;
        stroke-dashoffset: 1256.64;
        transform-origin: 960px 540px;
        animation: arcSpinner 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .dollar-symbol {
        font-family: 'Montserrat', 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 260px;
        fill: #40FF1A;
        text-anchor: middle;
        dominant-baseline: central;
        transform-origin: 0px 0px;
        animation: dollarBurst 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
    ]]></style>
  </defs>

  <!-- Clean Pure White Background (#ffffff) -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- Animated Glowing Outer Arc (Crisp #40FF1A, Radius 200, Stroke Width 12) -->
  <g filter="url(#crispNeonGlow)">
    <circle class="loading-arc" cx="960" cy="540" r="200" fill="none" stroke="#40FF1A" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Animated Glowing Center Dollar Symbol ($) - 100% Sharp Vector Edge -->
  <g filter="url(#crispNeonGlow)">
    <text class="dollar-symbol" x="0" y="0">$</text>
  </g>
</svg>