    <!-- 3. Subtitle Group (Animated Bell Icon + "Alarm" Label) -->
    <g id="subtitleGroup">
      <!-- Animated Bell Icon aligned with time left-edge -->
      <g transform="translate(344.0, 620.0)">
        <!-- Sound Vibration Left Arc -->
        <path d="M-20 -5 C-26 5 -26 13 -20 22" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" opacity="0">
