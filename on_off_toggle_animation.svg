<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Filter for soft shadow on knob -->
    <filter id="knobShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>

    <!-- Radial Green Glow -->
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#f8fafc" />

  <!-- Radial Glow behind toggle (visible when ON) -->
  <circle cx="960" cy="460" r="280" fill="url(#greenGlow)">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.20; 0.32; 0.74; 0.86; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
  </circle>

  <!-- Toggle Pill Body -->
  <!-- Dimensions: width=350, height=200, rx=100. Center=(960, 460) -> x=785, y=360 -->
  <rect x="785" y="360" width="350" height="200" rx="100" ry="100" fill="#cbd5e1">
    <animate attributeName="fill"
      values="#cbd5e1; #cbd5e1; #22c55e; #22c55e; #cbd5e1; #cbd5e1"
      keyTimes="0; 0.20; 0.32; 0.74; 0.86; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
  </rect>

  <!-- Toggle Knob (Circle) -->
  <!-- Left position (OFF): cx=885, cy=460, r=82 -->
  <!-- Right position (ON): cx=1035, cy=460, r=82 -->
  <circle cx="885" cy="460" r="82" fill="#ffffff" filter="url(#knobShadow)">
    <animate attributeName="cx"
      values="885; 885; 1035; 1035; 885; 885"
      keyTimes="0; 0.20; 0.32; 0.74; 0.86; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
  </circle>

  <!-- OFF Text Group -->
  <g fill="#cbd5e1">
    <animate attributeName="opacity"
      values="1; 1; 0; 0; 1; 1"
      keyTimes="0; 0.20; 0.28; 0.78; 0.86; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0; 0 0; 0 -12; 0 -12; 0 0; 0 0"
      keyTimes="0; 0.20; 0.28; 0.78; 0.86; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
    <g>
      <path d="M93 732Q93 1091 293.0 1291.0Q493 1491 850 1491Q1216 1491 1414.0 1294.5Q1612 1098 1612 744Q1612 487 1525.5 322.5Q1439 158 1275.5 66.5Q1112 -25 868 -25Q620 -25 457.5 54.0Q295 133 194.0 304.0Q93 475 93 732ZM546 730Q546 508 628.5 411.0Q711 314 853 314Q999 314 1079.0 409.0Q1159 504 1159 750Q1159 957 1075.5 1052.5Q992 1148 849 1148Q712 1148 629.0 1051.0Q546 954 546 730Z" transform="translate(840.82, 720.00) scale(0.05371, -0.05371)" />
      <path d="M152 1466H1272V1151H607V895H1175V599H607V0H152Z" transform="translate(932.45, 720.00) scale(0.05371, -0.05371)" />
      <path d="M152 1466H1272V1151H607V895H1175V599H607V0H152Z" transform="translate(1005.82, 720.00) scale(0.05371, -0.05371)" />
    </g>
  </g>

  <!-- ON Text Group -->
  <g fill="#22c55e">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.24; 0.32; 0.74; 0.82; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
    <animateTransform attributeName="transform"
      type="translate"
      values="0 12; 0 12; 0 0; 0 0; 0 12; 0 12"
      keyTimes="0; 0.24; 0.32; 0.74; 0.82; 1"
      dur="5s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0; 0.4 0.0 0.2 1.0" />
    <g>
      <path d="M93 732Q93 1091 293.0 1291.0Q493 1491 850 1491Q1216 1491 1414.0 1294.5Q1612 1098 1612 744Q1612 487 1525.5 322.5Q1439 158 1275.5 66.5Q1112 -25 868 -25Q620 -25 457.5 54.0Q295 133 194.0 304.0Q93 475 93 732ZM546 730Q546 508 628.5 411.0Q711 314 853 314Q999 314 1079.0 409.0Q1159 504 1159 750Q1159 957 1075.5 1052.5Q992 1148 849 1148Q712 1148 629.0 1051.0Q546 954 546 730Z" transform="translate(868.37, 720.00) scale(0.05371, -0.05371)" />
      <path d="M153 1466H576L1128 655V1466H1555V0H1128L579 805V0H153Z" transform="translate(960.00, 720.00) scale(0.05371, -0.05371)" />
    </g>
  </g>
</svg>
