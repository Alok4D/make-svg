<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- White background -->
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="none" stroke="#E53935" stroke-width="60"
     stroke-linecap="butt" stroke-linejoin="miter">

    <!-- 1. Animated Red Circle Stroke (draws 0s -> 1.8s, zero initial artifacts) -->
    <circle cx="960" cy="540" r="340"
            stroke-dasharray="2150 2150"
            stroke-dashoffset="2150"
            transform="rotate(-90 960 540)">
      <animate attributeName="stroke-dashoffset"
               from="2150" to="0"
               dur="1.8s" begin="0s"
               fill="freeze"
               calcMode="spline"
               keySplines="0.25 0.1 0.25 1"/>
    </circle>

    <!-- 2. Solid Full Red Circle (switches on at 1.8s to guarantee 100% seamless closed ring with ZERO hairline gap) -->
    <circle cx="960" cy="540" r="340" opacity="0">
      <animate attributeName="opacity"
               to="1" dur="0.01s" begin="1.8s"
               fill="freeze"/>
    </circle>

    <!-- 3. Animated Red Diagonal Slash (hidden until 1.95s, zero initial artifacts) -->
    <g opacity="0">
      <animate attributeName="opacity"
               to="1" dur="0.01s" begin="1.95s"
               fill="freeze"/>
      <line x1="720" y1="780" x2="1200" y2="300"
            stroke-dasharray="680 680"
            stroke-dashoffset="680">
        <animate attributeName="stroke-dashoffset"
                 from="680" to="0"
                 dur="0.9s" begin="1.95s"
                 fill="freeze"
                 calcMode="spline"
                 keySplines="0.25 0.1 0.25 1"/>
      </line>
    </g>

    <!-- 4. Solid Full Red Line (switches on at 2.85s to guarantee perfect crisp edges) -->
    <line x1="720" y1="780" x2="1200" y2="300" opacity="0">
      <animate attributeName="opacity"
               to="1" dur="0.01s" begin="2.85s"
               fill="freeze"/>
    </line>

  </g>
</svg>
