<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      * {
        box-sizing: border-box;
      }

      .bg-canvas {
        fill: #000000;
      }

      circle {
        fill: #ffffff;
      }

      
      .dot-node-1 {
        transform-origin: 960.0px 200.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.0s;
      }
      .dot-node-2 {
        transform-origin: 1130.0px 245.55px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -1.1s;
      }
      .dot-node-3 {
        transform-origin: 1254.45px 370.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -1.0s;
      }
      .dot-node-4 {
        transform-origin: 1300.0px 540.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.9s;
      }
      .dot-node-5 {
        transform-origin: 1254.45px 710.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.8s;
      }
      .dot-node-6 {
        transform-origin: 1130.0px 834.45px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.7s;
      }
      .dot-node-7 {
        transform-origin: 960.0px 880.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.6s;
      }
      .dot-node-8 {
        transform-origin: 790.0px 834.45px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.5s;
      }
      .dot-node-9 {
        transform-origin: 665.55px 710.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.4s;
      }
      .dot-node-10 {
        transform-origin: 620.0px 540.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.3s;
      }
      .dot-node-11 {
        transform-origin: 665.55px 370.0px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.2s;
      }
      .dot-node-12 {
        transform-origin: 790.0px 245.55px;
        animation: pulseWave 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -0.1s;
      }

      @keyframes pulseWave {
        0%, 100% {
          transform: scale(0.55);
          opacity: 0.12;
        }
        25% {
          transform: scale(1.32);
          opacity: 1.0;
          filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.95));
        }
        50% {
          transform: scale(0.85);
          opacity: 0.45;
          filter: none;
        }
        75% {
          transform: scale(0.62);
          opacity: 0.22;
        }
      }
    ]]></style>
  </defs>

  <!-- Deep Pitch Black Background -->
  <rect class="bg-canvas" width="1920" height="1080" />

  <!-- 12-Dot Clockwise Fluid Pulse-Wave Chaser -->
  <g class="pulse-chaser-layer">
    <circle cx="960.0" cy="200.0" r="46.0" class="dot-node-1" />
    <circle cx="1130.0" cy="245.55" r="46.0" class="dot-node-2" />
    <circle cx="1254.45" cy="370.0" r="46.0" class="dot-node-3" />
    <circle cx="1300.0" cy="540.0" r="46.0" class="dot-node-4" />
    <circle cx="1254.45" cy="710.0" r="46.0" class="dot-node-5" />
    <circle cx="1130.0" cy="834.45" r="46.0" class="dot-node-6" />
    <circle cx="960.0" cy="880.0" r="46.0" class="dot-node-7" />
    <circle cx="790.0" cy="834.45" r="46.0" class="dot-node-8" />
    <circle cx="665.55" cy="710.0" r="46.0" class="dot-node-9" />
    <circle cx="620.0" cy="540.0" r="46.0" class="dot-node-10" />
    <circle cx="665.55" cy="370.0" r="46.0" class="dot-node-11" />
    <circle cx="790.0" cy="245.55" r="46.0" class="dot-node-12" />
  </g>
</svg>