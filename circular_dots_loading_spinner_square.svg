<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      * {
        box-sizing: border-box;
      }

      .bg-canvas {
        fill: #000494;
      }

      .spinner-group {
        transform-origin: 500.0px 500.0px;
        animation: spin 1s steps(12, end) infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    ]]></style>

    <!-- Glowing Head Filter -->
    <filter id="glowHeadSq" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Midnight Blue Background -->
  <rect class="bg-canvas" width="1000" height="1000" />

  <!-- 12-Dot Cyan to Indigo Stepped Loading Spinner -->
  <g class="spinner-group">
    <circle cx="500.0" cy="180.0" r="44.0" fill="#00f5ff" opacity="1.0" filter="url(#glowHeadSq)" />
    <circle cx="340.0" cy="222.87" r="44.0" fill="#00e1ff" opacity="0.92" />
    <circle cx="222.87" cy="340.0" r="44.0" fill="#00cbff" opacity="0.83" />
    <circle cx="180.0" cy="500.0" r="44.0" fill="#00b2ff" opacity="0.74" />
    <circle cx="222.87" cy="660.0" r="44.0" fill="#0096ff" opacity="0.65" />
    <circle cx="340.0" cy="777.13" r="44.0" fill="#007aff" opacity="0.55" />
    <circle cx="500.0" cy="820.0" r="44.0" fill="#1d60ff" opacity="0.45" />
    <circle cx="660.0" cy="777.13" r="44.0" fill="#2d49ff" opacity="0.35" />
    <circle cx="777.13" cy="660.0" r="44.0" fill="#3a33ef" opacity="0.25" />
    <circle cx="820.0" cy="500.0" r="44.0" fill="#3420cc" opacity="0.16" />
    <circle cx="777.13" cy="340.0" r="44.0" fill="#2210a0" opacity="0.08" />
    <circle cx="660.0" cy="222.87" r="44.0" fill="#120478" opacity="0.0" />
  </g>
</svg>