<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      .bg-canvas {
        fill: #000000;
      }

      .spinner-group {
        transform-origin: 500px 500px;
        animation: spin 1s steps(12, end) infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    ]]></style>

    <filter id="glowHeadBW" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect class="bg-canvas" width="1000" height="1000" />

  <g class="spinner-group">
    <circle cx="500.0" cy="240.0" r="28.0" fill="#ffffff" opacity="1.0" filter="url(#glowHeadBW)" />
    <circle cx="370.0" cy="274.83" r="28.0" fill="#f8fafc" opacity="0.92" />
    <circle cx="274.83" cy="370.0" r="28.0" fill="#f1f5f9" opacity="0.83" />
    <circle cx="240.0" cy="500.0" r="28.0" fill="#e2e8f0" opacity="0.74" />
    <circle cx="274.83" cy="630.0" r="28.0" fill="#cbd5e1" opacity="0.65" />
    <circle cx="370.0" cy="725.17" r="28.0" fill="#94a3b8" opacity="0.55" />
    <circle cx="500.0" cy="760.0" r="28.0" fill="#64748b" opacity="0.45" />
    <circle cx="630.0" cy="725.17" r="28.0" fill="#475569" opacity="0.35" />
    <circle cx="725.17" cy="630.0" r="28.0" fill="#334155" opacity="0.25" />
    <circle cx="760.0" cy="500.0" r="28.0" fill="#1e293b" opacity="0.16" />
    <circle cx="725.17" cy="370.0" r="28.0" fill="#0f172a" opacity="0.08" />
    <circle cx="630.0" cy="274.83" r="28.0" fill="#000000" opacity="0.0" />
  </g>
</svg>