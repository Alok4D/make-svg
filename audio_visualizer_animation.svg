  <!-- Deep Midnight / Violet Ambient Canvas -->
  <rect width="1920" height="1080" fill="#080712" />
  <rect width="1920" height="1080" fill="url(#bgAmbient)" />

  <!-- Top Header Label: NOW PLAYING -->
  <text x="960" y="215" class="header-text" filter="url(#textNeonGlow)">NOW PLAYING</text>

  <!-- Center Audio Waveform Equalizer Bars -->
  <g filter="url(#neonPurpleGlow)">
    <rect class="bar-0" x="720.0" y="445.0" width="14" height="70" rx="7.0" fill="url(#barGrad)" />
    <rect class="bar-1" x="744.0" y="432.5" width="14" height="95" rx="7.0" fill="url(#barGrad)" />
