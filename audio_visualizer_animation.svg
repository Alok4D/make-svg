<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Space Midnight Background Radial Ambient Gradient -->
    <radialGradient id="bgAmbient" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#1E143B" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#110E24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>

    <!-- Neon Violet / Electric Purple Gradient for Bars -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Electric Violet Outer Glow Filter -->
    <filter id="neonPurpleGlow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blurSharp" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurSharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Top Text Periwinkle Glow -->
    <filter id="textNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

