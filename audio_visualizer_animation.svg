      * { box-sizing: border-box; }

      .header-text {
        font-family: 'Open Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 8px;
        fill: #7B8CDE;
        text-anchor: middle;
      }

      .song-title {
        font-family: 'Open Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 42px;
        letter-spacing: 0.5px;
        fill: #FFFFFF;
        text-anchor: middle;
      }

      .artist-subtitle {
        font-family: 'Open Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 1px;
        fill: #64748B;
        text-anchor: middle;
      }

      /* Equalizer Bars Animations (Fluid Vertically Centered Scaling) */

      @keyframes eqBar_0 {
        0%, 100% { transform: scaleY(1); }
        25% { transform: scaleY(1.57); }
        50% { transform: scaleY(0.50); }
        75% { transform: scaleY(1.04); }
      }
      .bar-0 {
        transform-origin: 727.0px 480px;
        animation: eqBar_0 1.20s ease-in-out infinite alternate 0.10s;
      }

      @keyframes eqBar_1 {
