<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Realistic subtle drop shadow on toggle knob -->
    <filter id="knobShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
    .time-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif;
      font-size: 76px;
      font-weight: 300;
      letter-spacing: -1px;
    }
    .ampm-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0px;
    }
    .label-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }
  </style>

  <!-- Pure black widescreen background -->
  <rect width="1920" height="1080" fill="#000000"/>

  <!-- ==================== 5 ALARM ITEMS LIST ==================== -->
  <g id="alarmList">

    <!-- ==================== 1. 6:00 AM ==================== -->
    <g id="alarmRow1">
      <!-- Alarm Time & AM -->
      <text x="560" y="248" class="time-text" fill="#6b7280">
        6:00<tspan dx="14" class="ampm-text">AM</tspan>
        <animate attributeName="fill"
                 values="#6b7280; #6b7280; #ffffff; #ffffff; #6b7280; #6b7280"
                 keyTimes="0; 0.10; 0.16; 0.70; 0.76; 1"
                 dur="6.0s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1"/>
      </text>

      <!-- Subtitle Label -->
      <text x="560" y="286" class="label-text" fill="#4b5563">
        Alarm
        <animate attributeName="fill"
                 values="#4b5563; #4b5563; #9ca3af; #9ca3af; #4b5563; #4b5563"
                 keyTimes="0; 0.10; 0.16; 0.70; 0.76; 1"
                 dur="6.0s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1"/>
      </text>

      <!-- Toggle Track Pill -->
      <rect x="1240" y="216" width="120" height="72" rx="36" ry="36" fill="#374151">
        <animate attributeName="fill"
                 values="#374151; #374151; #22c55e; #22c55e; #374151; #374151"
                 keyTimes="0; 0.10; 0.16; 0.70; 0.76; 1"
                 dur="6.0s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1"/>
      </rect>

      <!-- Toggle Knob (Circle) -->
      <circle cx="1276" cy="252" r="30" fill="#ffffff" filter="url(#knobShadow)">
        <animate attributeName="cx"
                 values="1276; 1276; 1324; 1324; 1276; 1276"
                 keyTimes="0; 0.10; 0.16; 0.70; 0.76; 1"
                 dur="6.0s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1; 0.25 1 0.5 1; 0.25 0.1 0.25 1"/>
      </circle>

      <!-- Subtle Divider Line -->
      <line x1="560" y1="324" x2="1360" y2="324" stroke="#27272a" stroke-width="1.5" stroke-opacity="0.8"/>
    </g>


