<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      * {
        box-sizing: border-box;
      }

      .bg-canvas {
        fill: #06070d;
      }

      /* Center Ambient Radial Glow */
      .ambient-glow {
        opacity: 0.7;
      }

      /* Main Comet-Tail Spinner - Slower & Smoother Luxury Timing (1.5s) */
      .comet-spinner {
        transform-origin: 960.0px 540.0px;
        animation: spinComet 1.5s steps(12, end) infinite;
      }

      @keyframes spinComet {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    ]]></style>

    <!-- Neon Glow Filter -->
    <filter id="glowNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Center Glow Gradient -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#06070d" stop-opacity="0" />
    </radialGradient>

    <!-- Head Node Neon Gradient -->
    <linearGradient id="neonHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Trail Dots Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas Background -->
  <rect class="bg-canvas" width="1920" height="1080" />

  <!-- Center Ambient Radiance -->
  <circle cx="960.0" cy="540.0" r="560" fill="url(#centerGlow)" class="ambient-glow" />

  <!-- 12-Dot Tapered Comet-Tail Motion Vector (Pure Clean without Orbit Circles) -->
  <g class="comet-spinner">
    <!-- Head Node (Glowing Comet Leader) -->
    <circle cx="960.0" cy="180.0" r="52.0" fill="url(#neonHeadGrad)" filter="url(#glowNeon)" opacity="1.0" />
    <circle cx="960.0" cy="180.0" r="23.4" fill="#ffffff" opacity="0.95" />
    <circle cx="780.0" cy="228.23" r="47.0" fill="url(#dotGrad)" opacity="0.92" />
    <circle cx="648.23" cy="360.0" r="42.0" fill="url(#dotGrad)" opacity="0.83" />
    <circle cx="600.0" cy="540.0" r="37.0" fill="url(#dotGrad)" opacity="0.74" />
    <circle cx="648.23" cy="720.0" r="32.0" fill="url(#dotGrad)" opacity="0.64" />
    <circle cx="780.0" cy="851.77" r="28.0" fill="url(#dotGrad)" opacity="0.54" />
    <circle cx="960.0" cy="900.0" r="24.0" fill="url(#dotGrad)" opacity="0.44" />
    <circle cx="1140.0" cy="851.77" r="20.0" fill="url(#dotGrad)" opacity="0.34" />
    <circle cx="1271.77" cy="720.0" r="16.0" fill="url(#dotGrad)" opacity="0.22" />
    <circle cx="1320.0" cy="540.0" r="13.0" fill="url(#dotGrad)" opacity="0.12" />
    <circle cx="1271.77" cy="360.0" r="10.0" fill="url(#dotGrad)" opacity="0.04" />
  </g>

</svg>