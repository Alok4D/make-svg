<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      * { box-sizing: border-box; }
      .bg-canvas { fill: #06070d; }
      .ambient-glow { opacity: 0.7; }
      .orbit-track {
        fill: none;
        stroke: rgba(147, 197, 253, 0.08);
        stroke-width: 2;
        stroke-dasharray: 6 10;
        animation: rotateTrack 24s linear infinite;
        transform-origin: 500.0px 500.0px;
      }
      .orbit-track-inner {
        fill: none;
        stroke: rgba(168, 85, 247, 0.06);
        stroke-width: 1.5;
        stroke-dasharray: 4 8;
        animation: rotateTrackReverse 18s linear infinite;
        transform-origin: 500.0px 500.0px;
      }
      .comet-spinner {
        transform-origin: 500.0px 500.0px;
        animation: spinComet 1.0s steps(12, end) infinite;
      }
      @keyframes spinComet {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rotateTrack {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rotateTrackReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
    ]]></style>

    <filter id="glowNeonSq" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerGlowSq" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#06070d" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonHeadGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="dotGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <rect class="bg-canvas" width="1000" height="1000" />
  <circle cx="500.0" cy="500.0" r="480" fill="url(#centerGlowSq)" class="ambient-glow" />

  <circle cx="500.0" cy="500.0" r="330.0" class="orbit-track" />
  <circle cx="500.0" cy="500.0" r="250.0" class="orbit-track-inner" />
  <circle cx="500.0" cy="500.0" r="410.0" class="orbit-track-inner" />

  <g class="comet-spinner">
    <circle cx="500.0" cy="170.0" r="47.7" fill="url(#neonHeadGradSq)" filter="url(#glowNeonSq)" opacity="1.0" />
    <circle cx="500.0" cy="170.0" r="21.5" fill="#ffffff" opacity="0.95" />
    <circle cx="335.0" cy="214.21" r="43.1" fill="url(#dotGradSq)" opacity="0.92" />
    <circle cx="214.21" cy="335.0" r="38.5" fill="url(#dotGradSq)" opacity="0.83" />
    <circle cx="170.0" cy="500.0" r="33.9" fill="url(#dotGradSq)" opacity="0.74" />
    <circle cx="214.21" cy="665.0" r="29.3" fill="url(#dotGradSq)" opacity="0.64" />
    <circle cx="335.0" cy="785.79" r="25.7" fill="url(#dotGradSq)" opacity="0.54" />
    <circle cx="500.0" cy="830.0" r="22.0" fill="url(#dotGradSq)" opacity="0.44" />
    <circle cx="665.0" cy="785.79" r="18.3" fill="url(#dotGradSq)" opacity="0.34" />
    <circle cx="785.79" cy="665.0" r="14.7" fill="url(#dotGradSq)" opacity="0.24" />
    <circle cx="830.0" cy="500.0" r="11.9" fill="url(#dotGradSq)" opacity="0.15" />
    <circle cx="785.79" cy="335.0" r="9.2" fill="url(#dotGradSq)" opacity="0.08" />
    <circle cx="665.0" cy="214.21" r="6.4" fill="url(#dotGradSq)" opacity="0.02" />
  </g>
</svg>